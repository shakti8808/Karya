<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page_description }}">
  <title>{{ page_title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/karya-icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shared.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/' ~ page_css) }}">
</head>
<body class="antialiased selection:bg-karya-lime selection:text-karya-night">
{% block content %}{% endblock %}
{% if page_js %}<script src="{{ url_for('static', filename='js/' ~ page_js) }}" defer></script>{% endif %}
</body>
</html>
